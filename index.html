<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dominó">
  <meta name="description" content="Dominó para un jugador contra el celular. Funciona sin conexión.">
  <title>Dominó</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Degradados compartidos por todas las fichas -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-face" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fffdf5"/>
        <stop offset="1" stop-color="#e6dcc3"/>
      </linearGradient>
      <linearGradient id="g-back" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b3262f"/>
        <stop offset="1" stop-color="#6d1119"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <header id="top">
      <button id="menuBtn" class="icon-btn" aria-label="Menú">&#9776;</button>
      <div class="score me"><span class="who">Tú</span><b id="scoreMe">0</b></div>
      <div class="goal">meta<br><b id="goal">100</b></div>
      <div class="score cpu"><span class="who">Celular</span><b id="scoreCpu">0</b></div>
      <div class="icon-spacer"></div>
    </header>

    <section id="cpu">
      <div id="cpuHand"></div>
      <div id="cpuLabel"><span class="phone">📱</span> <span id="cpuCount">0</span></div>
    </section>

    <main id="board"><div id="boardInner"></div></main>

    <section id="status">
      <div id="msg"></div>
      <button id="passBtn" hidden>Pasar</button>
      <button id="pool" aria-label="Pozo">
        <span class="pool-tile"></span>
        <span class="pool-text"><small>Pozo</small><b id="poolCount">0</b></span>
      </button>
    </section>

    <section id="hand"></section>
  </div>

  <div id="overlay" hidden><div class="card" id="card"></div></div>
  <div id="toast" hidden></div>

  <script src="game.js"></script>
</body>
</html>
